<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta name="color-scheme" content="light only">
  <meta name="supported-color-schemes" content="light">
  <meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>仓库</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{width:100%;height:100%;overflow:hidden;background:#000}
.stage{position:relative;width:2340px;height:1080px;transform-origin:top left;overflow:hidden}
.bg-img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;pointer-events:none}
/* 滚动容器 - 靠右边 */
.scroll-container{position:absolute;top:150px;right:80px;width:1000px;height:850px;overflow-y:auto;overflow-x:hidden;padding:30px;z-index:10}
.scroll-container::-webkit-scrollbar{display:none}
.scroll-container{scrollbar-width:none;-ms-overflow-style:none}
/* 空提示 */
.empty-tip{text-align:center;color:#fff;font-size:32px;padding:100px 0;text-shadow:0 0 10px rgba(0,0,0,0.8)}
/* 道具网格 - 2个一行 */
.items-grid{display:grid;grid-template-columns:repeat(2,38%);justify-content:center;row-gap:48px;column-gap:8px;margin-bottom:40px}
/* 道具格子 */
.item-slot{position:relative;width:100%;aspect-ratio:1;display:flex;align-items:center;justify-content:center;transition:all 0.2s;transform:translateX(40%)}
.item-slot .slot-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block}
.item-slot .item-img{position:absolute;inset:10%;width:80%;height:80%;object-fit:contain;display:block;z-index:2}
.item-slot .item-name{position:absolute;left:-40px;right:-40px;top:105%;text-align:center;font-size:24px;font-weight:bold;color:#111;text-shadow:0 2px 8px rgba(0,0,0,0.8);z-index:3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item-slot .item-count{position:absolute;right:30%;bottom:30%;color:#fff;font-size:22px;font-weight:bold;text-shadow:0 0 5px rgba(0,0,0,0.9);z-index:4}
/* 底部按钮区域 */
.bottom-bar{position:absolute;bottom:0;left:0;right:0;height:140px;z-index:20}
/* 关闭按钮 */
.close-btn{position:absolute;left:40px;top:30px;width:100px;height:100px;background:transparent;border:none;cursor:pointer;z-index:100}
</style>
<style>

/* ===== 防止浏览器暗夜模式自动反转颜色 ===== */
:root {
  color-scheme: light only;
  -webkit-color-scheme: light only;
}
html {
  color-scheme: light only;
  -webkit-color-scheme: light only;
  background-color: #000 !important;
}
body {
  color-scheme: light only;
  -webkit-color-scheme: light only;
  background-color: #000 !important;
  -webkit-lightness-adjust: none !important;
}
/* 防止图片被反转 */
img {
  -webkit-filter: none !important;
  filter: none !important;
}
/* ============================================ */

</style>
</head>
<body>
<div class="stage" id="stage">
  <img class="bg-img" src="../images/pages/warehouse/bg.png" alt="仓库背景">
  <button class="close-btn" id="closeBtn"></button>
  <div class="scroll-container" id="scrollContainer">
    <div class="empty-tip" id="emptyTip" style="display:none"></div>
    <div class="items-grid" id="itemsGrid"></div>
  </div>
  <div class="bottom-bar"></div>
</div>
<script>
// 三种品质的黑色小方块图片
var SLOT_IMAGES = {
  white: '../images/slot/white.png',
  purple: '../images/slot/purple.png',
  gold: '../images/slot/gold.png',
  red: '../images/slot/red.png'
};

// 仓库数据
var warehouseItems = [];

// 道具名称到item小图路径的映射表（暂存箱/仓库统一用item小图显示）
var ITEM_SMALL_IMAGES = {
  '传说女帝': '../images/items/red/传说女帝.png',
  '王者之魄': '../images/items/gold/王者之魄.png',
  '王者之翼': '../images/items/gold/王者之翼.png',
  '王者之魄-传说光耀': '../images/items/red/王者之魄-传说光耀.png',
  '王者之翼-传说夜影': '../images/items/red/王者之翼-传说夜影.png',
  'SCAR Light-玄豹': '../images/items/gold/SCAR Light-玄豹.png',
  '左轮-玄豹': '../images/items/gold/左轮-玄豹.png',
  '丛林匕首-玄豹': '../images/items/gold/丛林匕首-玄豹.png',
  '手雷-玄豹': '../images/items/gold/手雷-玄豹.png',
  '闪光弹-玄豹': '../images/items/gold/闪光弹-玄豹.png',
  '烟雾弹-玄豹': '../images/items/gold/烟雾弹-玄豹.png',
  '最终消灭-堕落天使': '../images/items/gold/最终消灭-堕落天使.png',
  '狙击枪线-光与夜': '../images/items/gold/狙击枪线-光与夜.png',
  '夜影精灵玩偶': '../images/items/gold/夜影精灵玩偶.png',
  '光耀精灵玩偶': '../images/items/gold/光耀精灵玩偶.png',
  '夜影精灵挂饰': '../images/items/gold/夜影精灵挂饰.png',
  '光耀精灵挂饰': '../images/items/gold/光耀精灵挂饰.png',
  '抛物线-光与夜': '../images/items/gold/抛物线-光与夜.png',
  '印花-玄豹': '../images/items/gold/印花-玄豹.png',
  '印花-夜影光耀': '../images/items/gold/印花-夜影光耀.png',
  '王者之翼-夜影之触': '../images/items/gold/王者之翼-夜影之触.png',
  '王者之魄-光耀之触': '../images/items/gold/王者之魄-光耀之触.png',
  '王者之翼-夜影之殇': '../images/items/gold/王者之翼-夜影之殇.png',
  '王者之魄-光耀之殇': '../images/items/gold/王者之魄-光耀之殇.png',
  '王者之翼-夜影之印': '../images/items/gold/王者之翼-夜影之印.png',
  '王者之魄-光耀之印': '../images/items/gold/王者之魄-光耀之印.png',
  'SCAR Light-玄豹之触': '../images/items/gold/SCAR Light-玄豹之触.png',
  'SCAR Light-玄豹-豹慑之殇': '../images/items/gold/SCAR Light-玄豹-豹慑之殇.png',
  'SCAR Light-玄豹-豹慑之印': '../images/items/gold/SCAR Light-玄豹-豹慑之印.png',
  '神兵匣积分×18': '../images/items/purple/神兵匣积分.png',
  '神兵匣积分×12': '../images/items/purple/神兵匣积分.png',
  '神兵匣积分×6': '../images/items/purple/神兵匣积分.png',
  '神兵匣积分×3': '../images/items/purple/神兵匣积分.png',
  '神兵匣积分×2': '../images/items/purple/神兵匣积分.png',
  'AK47-星象': '../images/items/gold/AK47-星象.png',
  'AK47-星象-璀璨星辰·朱雀': '../images/items/gold/AK47-星象-璀璨星辰朱雀.png',
  'COP 357-星象-璀璨星辰·朱雀': '../images/items/gold/COP357-星象-璀璨星辰朱雀.png',
  '尼泊尔-星象-璀璨星辰·朱雀': '../images/items/gold/尼泊尔-星象-璀璨星辰朱雀.png',
  'M16-聚变脉冲': '../images/items/gold/M16-聚变脉冲.png',
  'MK23-聚变脉冲': '../images/items/gold/MK23-聚变脉冲.png',
  '爪刀-聚变脉冲': '../images/items/gold/爪刀-聚变脉冲.png',
  'COP 357-星象': '../images/items/gold/COP357-星象.png',
  '尼泊尔-星象': '../images/items/gold/尼泊尔-星象.png',
  '甄梦': '../images/items/gold/甄梦.png',
  '乔月': '../images/items/gold/乔月.png',

};


// 自适应缩放
function layout(){
  var s = Math.min(window.innerWidth/2340, window.innerHeight/1080);
  document.getElementById('stage').style.transform = 'scale('+s+')';
  document.getElementById('stage').style.left = (window.innerWidth - 2340*s)/2 + 'px';
  document.getElementById('stage').style.top = (window.innerHeight - 1080*s)/2 + 'px';
}
window.addEventListener('resize', layout);
layout();

// 渲染仓库
function renderWarehouse(){
  var grid = document.getElementById('itemsGrid');
  var emptyTip = document.getElementById('emptyTip');
  
  if(warehouseItems.length === 0){
    emptyTip.style.display = 'block';
    grid.innerHTML = '';
    return;
  }
  
  emptyTip.style.display = 'none';
  grid.innerHTML = '';
  
  // 按品质排序：金色 > 紫色 > 白色
  warehouseItems.sort(function(a, b){
    var qualityOrder = {red: -1, gold: 0, purple: 1, white: 2};
    if(qualityOrder[a.quality] !== qualityOrder[b.quality]){
      return qualityOrder[a.quality] - qualityOrder[b.quality];
    }
    return (a.weight || 0) - (b.weight || 0);
  });
  
  warehouseItems.forEach(function(item, index){
    var slot = document.createElement('div');
    slot.className = 'item-slot quality-' + item.quality;
    slot.dataset.index = index;
    
    var slotBg = document.createElement('img');
    slotBg.className = 'slot-bg';
    slotBg.src = SLOT_IMAGES[item.quality];
    slot.appendChild(slotBg);
    
    var itemImg = document.createElement('img');
    itemImg.className = 'item-img';
    // 优先使用item小图映射，没有则用传入的image
    if(ITEM_SMALL_IMAGES[item.name]){
      itemImg.src = ITEM_SMALL_IMAGES[item.name];
    }else{
      itemImg.src = item.image;
    }
    slot.appendChild(itemImg);
    
    var itemName = document.createElement('div');
    itemName.className = 'item-name';
    itemName.textContent = item.name;
    slot.appendChild(itemName);
    
    if(item.count > 1){
      var itemCount = document.createElement('div');
      itemCount.className = 'item-count';
      itemCount.textContent = 'x' + item.count;
      slot.appendChild(itemCount);
    }
    
    grid.appendChild(slot);
  });
}

// 接收主页面传来的仓库数据
window.addEventListener('message', function(e){
  if(e.data && e.data.type === 'warehouseData'){
    warehouseItems = e.data.items || [];
    renderWarehouse();
  }
});

// 关闭按钮
document.getElementById('closeBtn').addEventListener('click', function(){
  window.parent.postMessage({type:'closeWarehouse'}, '*');
});
</script>

<script>
// 禁止长按弹出菜单
document.addEventListener('contextmenu', function(e){
  e.preventDefault();
  return false;
});
// 禁止图片拖拽
document.addEventListener('dragstart', function(e){
  if(e.target.tagName === 'IMG'){
    e.preventDefault();
    return false;
  }
});
</script>
</body>
</html>
